name: NeriPlayer Nightly Release

on:
  schedule:
    - cron: '0 14 * * *' # 22:00 UTC+8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'cwuom/NeriPlayer' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check for a nightly tag at this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly-${GITHUB_SHA}"
          # 查 tag 而不是 release：手动删掉有问题的 nightly release 但保留 tag 时，不会把同一提交再发一次
          status="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          case "$status" in
            200) echo "Tag ${tag} already exists, skipping the build. Delete the tag to rebuild this commit." >> "$GITHUB_STEP_SUMMARY" ;;
            404) echo "tag=${tag}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Nightly tag lookup returned HTTP ${status}"; exit 1 ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/manual_release.yml
    with:
      nightly_tag: ${{ needs.check.outputs.tag }}
    secrets:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  prune:
    needs: [check, publish]
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove superseded nightly releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          # 新 nightly 确认已发布后才清理旧的，保证 Releases 页面始终留有一个 nightly
          gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null

          releases="${RUNNER_TEMP}/nightly-releases.txt"
          tags="${RUNNER_TEMP}/nightly-tags.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("nightly-")) | .tag_name' > "$releases"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/nightly-" \
            --jq '.[].ref | ltrimstr("refs/tags/")' > "$tags"

          while read -r tag; do
            [[ "$tag" == "$CURRENT_TAG" ]] && continue
            if grep -Fxq "$tag" "$releases"; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            else
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
            echo "Removed superseded nightly ${tag}" >> "$GITHUB_STEP_SUMMARY"
          done < <(sort -u "$releases" "$tags")
