name: NeriPlayer Nightly Release

on:
  schedule:
    - cron: '0 14 * * *' # 22:00 UTC+8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'cwuom/NeriPlayer' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check for a published nightly at this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly-${GITHUB_SHA}"
          status="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "$status" in
            200) echo "Already published ${tag}, skipping the build." >> "$GITHUB_STEP_SUMMARY" ;;
            404) echo "tag=${tag}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Nightly release lookup returned HTTP ${status}"; exit 1 ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/manual_release.yml
    with:
      nightly_tag: ${{ needs.check.outputs.tag }}
    secrets:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
