name: NeriPlayer Android CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/scripts/issue_labels*'
      - '.github/scripts/sync_labels.cjs'
      - '.github/scripts/check_issue_forms.rb'
      - '.github/workflows/issue_labels.yml'
      - '.github/workflows/sync_labels.yml'
      - '.github/workflows/automation_checks.yml'
      - '.github/workflows/manual_release.yml'
      - '.github/workflows/recover_keystore.yml'
      - 'site/**'
      - '.github/workflows/site_pages.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/scripts/issue_labels*'
      - '.github/scripts/sync_labels.cjs'
      - '.github/scripts/check_issue_forms.rb'
      - '.github/workflows/issue_labels.yml'
      - '.github/workflows/sync_labels.yml'
      - '.github/workflows/automation_checks.yml'
      - '.github/workflows/manual_release.yml'
      - '.github/workflows/recover_keystore.yml'
      - 'site/**'
      - '.github/workflows/site_pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-tooling:
    name: CI tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      build_uuid: ${{ steps.metadata.outputs.build_uuid }}
      build_timestamp: ${{ steps.metadata.outputs.build_timestamp }}
      build_version_timestamp: ${{ steps.metadata.outputs.build_version_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test automation scripts
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/*.test.cjs

      - name: Prepare shared build identity
        id: metadata
        run: python3 .github/scripts/release_artifacts.py prepare --github-output "$GITHUB_OUTPUT"

  gradle-tests:
    name: Gradle tests
    needs: ci-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    env:
      ORG_GRADLE_PROJECT_buildUuid: ${{ needs.ci-tooling.outputs.build_uuid }}
      ORG_GRADLE_PROJECT_buildTimestamp: ${{ needs.ci-tooling.outputs.build_timestamp }}
      ORG_GRADLE_PROJECT_buildVersionTimestamp: ${{ needs.ci-tooling.outputs.build_version_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Run unit tests, CRAP gate and lint
        run: >-
          ./gradlew :playback:logic:verifyCrap :playback:runtime:verifyCrap
          :lyrics:verifyCrap :platform:verifyCrap :platform:verifyDomainDependencies :sync:verifyCrap :sync:verifyDomainDependencies
          :local:verifySyncIntegrationCrap :download:logic:verifyCrap :download:runtime:verifyCrap
          verifyModularization --warning-mode all --stacktrace

      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.html
            **/build/reports/crap/**
            **/build/reports/problems/**
          if-no-files-found: ignore

  listen-together-tests:
    name: Listen Together tests
    needs: ci-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    env:
      ORG_GRADLE_PROJECT_buildUuid: ${{ needs.ci-tooling.outputs.build_uuid }}
      ORG_GRADLE_PROJECT_buildTimestamp: ${{ needs.ci-tooling.outputs.build_timestamp }}
      ORG_GRADLE_PROJECT_buildVersionTimestamp: ${{ needs.ci-tooling.outputs.build_version_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Run Android Listen Together tests
        run: ./gradlew :listentogether:verifyCrap :listentogether:verifyDomainDependencies :listentogether:lintDebug :listentogether:testDebugUnitTest :app:testDebugUnitTest --tests "*ListenTogether*" --warning-mode all --stacktrace

      - name: Upload Listen Together test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: listen-together-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            modules/listentogether/build/reports/crap/**
            modules/listentogether/build/reports/domain-dependencies/**
            modules/listentogether/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  android-instrumented-tests:
    name: Android instrumented tests (${{ matrix.test_group }})
    needs: ci-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    env:
      ORG_GRADLE_PROJECT_buildUuid: ${{ needs.ci-tooling.outputs.build_uuid }}
      ORG_GRADLE_PROJECT_buildTimestamp: ${{ needs.ci-tooling.outputs.build_timestamp }}
      ORG_GRADLE_PROJECT_buildVersionTimestamp: ${{ needs.ci-tooling.outputs.build_version_timestamp }}
    # 普通 app 测试按四个模拟器并行，库模块只在 0 号分片完整运行
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            test_group: shard 0
            emulator_gpu: swiftshader
            build_tasks: >-
              :database:assembleDebugAndroidTest :local:assembleDebugAndroidTest
              :playback:runtime:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest
            module_tests: >-
              :database:connectedDebugAndroidTest :local:connectedDebugAndroidTest
              :playback:runtime:connectedDebugAndroidTest
            app_test_arguments: >-
              -Pandroid.testInstrumentationRunnerArguments.numShards=4
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=0
              -Pandroid.testInstrumentationRunnerArguments.notClass=moe.ouom.neriplayer.ui.screen.tab.settings.component.floating.SettingsExternalLyricsPageTouchTest
              -Pandroid.testInstrumentationRunnerArguments.neriplayerAdditionalExcludedClass=moe.ouom.neriplayer.activity.MainActivityRotationContinuityTest
          - shard: 1
            test_group: shard 1
            # 该分片在 SwiftShader 宿主上重复掉线，用 ANGLE 路径隔离图形后端影响
            emulator_gpu: swangle
            build_tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            module_tests: ""
            app_test_arguments: >-
              -Pandroid.testInstrumentationRunnerArguments.numShards=4
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=1
              -Pandroid.testInstrumentationRunnerArguments.notClass=moe.ouom.neriplayer.ui.screen.tab.settings.component.floating.SettingsExternalLyricsPageTouchTest
              -Pandroid.testInstrumentationRunnerArguments.neriplayerAdditionalExcludedClass=moe.ouom.neriplayer.activity.MainActivityRotationContinuityTest
          - shard: 2
            test_group: shard 2
            emulator_gpu: swiftshader
            build_tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            module_tests: ""
            app_test_arguments: >-
              -Pandroid.testInstrumentationRunnerArguments.numShards=4
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=2
              -Pandroid.testInstrumentationRunnerArguments.notClass=moe.ouom.neriplayer.ui.screen.tab.settings.component.floating.SettingsExternalLyricsPageTouchTest
              -Pandroid.testInstrumentationRunnerArguments.neriplayerAdditionalExcludedClass=moe.ouom.neriplayer.activity.MainActivityRotationContinuityTest
          - shard: 3
            test_group: shard 3
            emulator_gpu: swiftshader
            build_tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            module_tests: ""
            app_test_arguments: >-
              -Pandroid.testInstrumentationRunnerArguments.numShards=4
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=3
              -Pandroid.testInstrumentationRunnerArguments.notClass=moe.ouom.neriplayer.ui.screen.tab.settings.component.floating.SettingsExternalLyricsPageTouchTest
              -Pandroid.testInstrumentationRunnerArguments.neriplayerAdditionalExcludedClass=moe.ouom.neriplayer.activity.MainActivityRotationContinuityTest
          # 完整宿主触摸回归使用独立的新 AVD，隔离套件间图形状态并保留全部断言
          - shard: 4
            test_group: External Lyrics host
            emulator_gpu: swangle
            offline: true
            build_tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            module_tests: ""
            app_test_arguments: >-
              -Pandroid.testInstrumentationRunnerArguments.class=moe.ouom.neriplayer.ui.screen.tab.settings.component.floating.SettingsExternalLyricsPageTouchTest
          # 真实 Activity 旋转单独运行，避免共享图形宿主的状态影响连续性回归
          - shard: 5
            test_group: Player rotation host
            emulator_gpu: swangle
            offline: true
            build_tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            module_tests: ""
            app_test_arguments: >-
              -Pandroid.testInstrumentationRunnerArguments.class=moe.ouom.neriplayer.activity.MainActivityRotationContinuityTest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Enable KVM
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 先编译好测试 APK 再启动模拟器，避免编译与空闲模拟器争抢 CPU 时 Launcher 无响应
      # 编译 JVM 随阶段退出，避免空闲编译守护进程在设备测试期间继续占用内存
      - name: Build instrumented test APKs
        run: >-
          ./gradlew ${{ matrix.build_tasks }} --no-daemon
          -Pkotlin.compiler.execution.strategy=in-process --warning-mode all --stacktrace

      - name: Record memory before emulator startup
        run: |
          mkdir -p build/reports/emulator-host || exit 0
          free -h > build/reports/emulator-host/before-emulator-memory.txt 2>&1 || true
          "$JAVA_HOME/bin/jps" -l > build/reports/emulator-host/before-emulator-jvm-classes.txt 2>&1 || true

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # 完整宿主和曾掉线的分片使用 ANGLE，其余分片保留原后端作为对照
          emulator-options: >-
            -no-window -gpu ${{ matrix.emulator_gpu }} -no-snapshot -noaudio -no-boot-anim
          # 保留 Launcher 组件，用设置页承接测试前的前台焦点
          # 首次沉浸模式提示会抢走原生输入，测试 AVD 预先标记已确认
          # 隐藏错误弹窗不会关闭已有 ANR，停止启动器和 SDK Setup 以清理无关窗口
          # 系统通知横幅可能覆盖原生触摸坐标，测试 AVD 关闭横幅
          # 完整宿主使用固定离线夹具，避免虚拟 Wi-Fi 失联反复移动迷你播放器
          script: >-
            { ps -eLo pid,tid,comm > build/reports/emulator-host/before-tests-threads.txt || true; } &&
            adb shell settings put global hide_error_dialogs 1 &&
            adb shell settings put global heads_up_notifications_enabled 0 &&
            adb shell 'test "$(settings get global heads_up_notifications_enabled)" = 0' &&
            adb shell settings --user 0 put secure anr_show_background 0 &&
            adb shell settings --user 0 put secure immersive_mode_confirmations confirmed &&
            adb shell am start -W -a android.settings.SETTINGS &&
            adb shell am force-stop --user 0 com.google.android.apps.nexuslauncher &&
            adb shell am force-stop --user 0 com.google.android.googlesdksetup &&
            { [ "${{ matrix.offline }}" != "true" ] ||
            { adb shell cmd connectivity airplane-mode enable && adb shell svc wifi disable; }; } &&
            { [ -z "${{ matrix.module_tests }}" ] || ./gradlew ${{ matrix.module_tests }}
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=moe.ouom.neriplayer.testing.ManualInstrumentedTest
            --no-daemon -Pkotlin.compiler.execution.strategy=in-process --warning-mode all --stacktrace; } &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=moe.ouom.neriplayer.testing.ManualInstrumentedTest
            ${{ matrix.app_test_arguments }}
            --no-daemon -Pkotlin.compiler.execution.strategy=in-process --warning-mode all --stacktrace

      - name: Verify instrumented test routing
        if: ${{ matrix.shard < 4 || matrix.test_group == 'Player rotation host' }}
        shell: python
        env:
          TEST_GROUP: ${{ matrix.test_group }}
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          rotation_class = "moe.ouom.neriplayer.activity.MainActivityRotationContinuityTest"
          external_lyrics_class = "moe.ouom.neriplayer.ui.screen.tab.settings.component.floating.SettingsExternalLyricsPageTouchTest"
          cases = [
              case
              for report in Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml")
              for case in ET.parse(report).iter("testcase")
          ]
          assert cases, "Instrumented test reports must contain executed cases"
          if os.environ["TEST_GROUP"] == "Player rotation host":
              expected = {
                  "cleanPlayerRotationPreservesSettingsDraftScrollAndBackDepth",
                  "materialPlayerRotationPreservesSettingsDraftScrollAndBackDepth",
              }
              assert all(case.get("classname") == rotation_class for case in cases), \
                  "Player rotation host must only execute its regression class"
              assert len(cases) == len(expected) and {case.get("name") for case in cases} == expected, \
                  "Both player rotation regression cases must execute"
              for case in cases:
                  assert not any(case.find(result) is not None for result in ("failure", "error", "skipped")), \
                      f"Player rotation regression did not pass: {case.get('name')}"
              print("Both player rotation regression cases executed and passed")
          else:
              assert all(case.get("classname") not in {rotation_class, external_lyrics_class} for case in cases), \
                  "Dedicated host tests must not execute in shared shards"
              print(f"Shared shard routing verified for {len(cases)} cases")

      - name: Collect emulator host diagnostics
        if: always()
        shell: bash
        run: |
          diagnostics_dir=build/reports/emulator-host
          mkdir -p "$diagnostics_dir" || exit 0
          date -u > "$diagnostics_dir/collected-at.txt" 2>&1 || true
          free -h > "$diagnostics_dir/memory.txt" 2>&1 || true
          df -h . > "$diagnostics_dir/disk.txt" 2>&1 || true
          ps -eo pid,comm,rss,%mem --sort=-rss > "$diagnostics_dir/processes.txt" 2>&1 || true
          "$JAVA_HOME/bin/jps" -l > "$diagnostics_dir/jvm-classes.txt" 2>&1 || true
          {
            if dmesg --color=never 2>/dev/null; then
              printf 'source=dmesg\n' >&2
            elif sudo -n dmesg --color=never 2>/dev/null; then
              printf 'source=sudo-dmesg\n' >&2
            else
              printf 'kernel log unavailable\n' >&2
            fi
          } 2> "$diagnostics_dir/kernel-status.txt" |
            grep -Ei 'out of memory|oom-kill|oom_reaper|killed process|segfault|qemu' \
              > "$diagnostics_dir/kernel-filtered.txt" || true

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-instrumented-test-reports-${{ matrix.shard }}
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
            build/reports/emulator-host/**
          if-no-files-found: ignore

  worker-check:
    name: Worker check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          sparse-checkout: np-submodule/NeriPlayer-LTW

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: np-submodule/NeriPlayer-LTW/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix np-submodule/NeriPlayer-LTW

      - name: Run Worker check
        run: npm run check --prefix np-submodule/NeriPlayer-LTW

  release-build:
    name: Release build
    needs: ci-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    env:
      ORG_GRADLE_PROJECT_buildUuid: ${{ needs.ci-tooling.outputs.build_uuid }}
      ORG_GRADLE_PROJECT_buildTimestamp: ${{ needs.ci-tooling.outputs.build_timestamp }}
      ORG_GRADLE_PROJECT_buildVersionTimestamp: ${{ needs.ci-tooling.outputs.build_version_timestamp }}
      NERI_BUILD_UUID: ${{ needs.ci-tooling.outputs.build_uuid }}
      NERI_BUILD_TIMESTAMP: ${{ needs.ci-tooling.outputs.build_timestamp }}
      NERI_BUILD_VERSION_TIMESTAMP: ${{ needs.ci-tooling.outputs.build_version_timestamp }}
      NERI_SIGNING_MODE: ${{ github.repository == 'cwuom/NeriPlayer' && github.event_name == 'push' && github.ref == 'refs/heads/master' && 'signed' || 'unsigned' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Decode keystore
        if: env.NERI_SIGNING_MODE == 'signed'
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/neri.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Verify Native USB behavior before packaging
        run: |
          tools_pub/usb-async-lab host-test \
            --manifest modules/native/src/main/cpp/tests/usb/config/run-manifest.example.yaml \
            --profile release-werror-asserts

      - name: Build unsigned Release
        if: env.NERI_SIGNING_MODE == 'unsigned'
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease=true --warning-mode all --stacktrace

      - name: Build signed Release for master
        if: env.NERI_SIGNING_MODE == 'signed'
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: neri.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: key0
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --warning-mode all --stacktrace

      - name: Verify and stage Release artifacts
        run: >-
          python3 .github/scripts/release_artifacts.py stage
          --apk-dir app/build/outputs/apk/release --output-dir build/release-artifacts

      - name: Upload unverified build candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-apk-candidate
          path: build/release-artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary signing keystore
        if: ${{ always() && env.NERI_SIGNING_MODE == 'signed' }}
        run: rm -f app/neri.jks

  build:
    name: build
    needs:
      - ci-tooling
      - gradle-tests
      - listen-together-tests
      - worker-check
      - android-instrumented-tests
      - release-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Require every CI gate to pass
        shell: python
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              print(f"Required CI gates did not pass: {failed}")
              sys.exit(1)
          print("All required CI gates passed")

      - name: Checkout test report verifier
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download emulator reports
        uses: actions/download-artifact@v7
        with:
          pattern: android-instrumented-test-reports-*
          path: build/instrumentation-reports

      - name: Verify complete and disjoint emulator routes
        run: >-
          python3 -B .github/scripts/verify_instrumentation.py build/instrumentation-reports
          --inventory-output build/instrumentation-inventory.json

      - name: Upload test inventory
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-inventory
          path: build/instrumentation-inventory.json
          if-no-files-found: error

      - name: Download verified build candidate
        uses: actions/download-artifact@v7
        with:
          name: release-apk-candidate
          path: build/release-artifacts

      - name: Verify candidate checksums
        working-directory: build/release-artifacts
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Publish CI APKs after all gates pass
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.repository == 'cwuom/NeriPlayer' && github.event_name == 'push' && github.ref == 'refs/heads/master' && 'neri-apk' || 'neri-apk-unsigned' }}
          path: build/release-artifacts/*
          if-no-files-found: error
          compression-level: 0

  upload-telegram:
    needs:
      - build
    runs-on: ubuntu-latest
    if: ${{ success() && github.repository == 'cwuom/NeriPlayer' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: neri-apk
          path: artifacts

      - name: Find APK file
        id: find_apk
        run: |
          apk=$(ls artifacts/*.apk)
          echo "apk_path=$apk" >> $GITHUB_OUTPUT

      - name: Send APK via Telegram API
        env:
          BOT_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH:    ${{ steps.find_apk.outputs.apk_path }}
          SHA:         ${{ github.sha }}
          COMMIT_MSG:  ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO:        ${{ github.repository }}
        run: |
          echo "Sending $APK_PATH"
          
          safe_commit_msg=$(echo "$COMMIT_MSG" | sed 's/&/&amp;/g; s/</&lt;/g; s/>/&gt;/g')
          
          commit_author="$COMMIT_AUTHOR"
          commit_url="https://github.com/${REPO}/commit/${SHA}"
          
          caption=" <b>检测到新的 GitHub 推送！</b>
          <b>Commit SHA:</b> <code>${SHA}</code>
          
          <pre>${safe_commit_msg}</pre>
          
          <b>提交者:</b> <code>${commit_author}</code>
          <a href=\"${commit_url}\">查看详情</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="${caption}" \
            -F parse_mode=HTML
