name: NeriPlayer Manual Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to release
        required: true
        default: master
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode keystore
        run: |
          mkdir -p app
          echo "$KEYSTORE_B64" | base64 -d > app/neri.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Prepare release metadata
        id: meta
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short HEAD)"
          target_sha="$(git rev-parse HEAD)"
          release_time="$(TZ=Asia/Taipei date +'%m%d%H%M')"
          tag_name="NeriPlayer-${short_sha}.${release_time}"
          previous_tag="$(git for-each-ref --merged HEAD --sort=-creatordate --format='%(refname:short)' 'refs/tags/NeriPlayer-*' | head -n 1 || true)"

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_time=${release_time}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Verify the checked out release sources
        run: |
          ./gradlew testDebugUnitTest lintDebug \
            --warning-mode all --stacktrace
          if [[ -f tools_pub/quality/module_boundaries.py ]]; then
            python3 -B tools_pub/quality/module_boundaries.py
          fi

      - name: Verify Native USB behavior
        run: |
          native_manifest=""
          for candidate in \
            modules/native/src/main/cpp/tests/usb/config/run-manifest.example.yaml \
            app/src/main/cpp/tests/usb/config/run-manifest.example.yaml; do
            if [[ -f "${candidate}" ]]; then
              native_manifest="${candidate}"
              break
            fi
          done
          if [[ -n "${native_manifest}" ]]; then
            tools_pub/usb-async-lab host-test \
              --manifest "${native_manifest}" \
              --profile release-werror-asserts
          elif [[ -f tools_pub/usb-async-lab ]]; then
            echo "Native USB host test manifest is missing from this target ref." >&2
            exit 1
          else
            echo "::notice::This target ref predates the Native USB host tests."
          fi

      - name: Build signed Release APKs
        run: |
          ./gradlew :app:assembleRelease \
            -PbuildAllReleaseAbis=true \
            -PbuildVersionTimestamp=${{ steps.meta.outputs.release_time }} \
            -PKEYSTORE_FILE=neri.jks \
            -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PKEY_ALIAS=key0 \
            -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            --warning-mode all --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ steps.meta.outputs.target_sha }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.*
            .report/usb/execution/**/host-release-werror-asserts/**/ctest.xml
            .report/usb/execution/**/host-release-werror-asserts/**/host-test.log
            .report/usb/execution/**/host-release-werror-asserts/**/source-context.txt
          include-hidden-files: true
          if-no-files-found: warn

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
        run: |
          set -euo pipefail

          api_args=(
            --method POST
            "repos/${REPO}/releases/generate-notes"
            -f "tag_name=${TAG_NAME}"
            -f "target_commitish=${TARGET_SHA}"
          )

          if [ -n "${PREVIOUS_TAG}" ]; then
            api_args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi

          gh api "${api_args[@]}" --jq '.body' > release-notes.md

          {
            echo
            echo
            echo "## Commits"
            if [ -n "${PREVIOUS_TAG}" ]; then
              git log --first-parent --pretty='- %h %s' "${PREVIOUS_TAG}..HEAD"
            else
              git log --first-parent --pretty='- %h %s'
            fi
          } >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          apk_files=(app/build/outputs/apk/release/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No release APKs were produced."
            exit 1
          fi

          gh release create "${TAG_NAME}" "${apk_files[@]}" \
            --repo "${REPO}" \
            --target "${TARGET_SHA}" \
            --title "${TAG_NAME}" \
            --notes-file release-notes.md \
            --latest
