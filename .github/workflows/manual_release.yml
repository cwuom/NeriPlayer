name: NeriPlayer Manual Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to release
        required: true
        default: master
        type: string
      test_release:
        description: Build unsigned test APKs and create only a draft prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

concurrency:
  group: manual-release-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Guard release destination
        env:
          TEST_RELEASE: ${{ inputs.test_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "cwuom/NeriPlayer" && "$TEST_RELEASE" != "true" ]]; then
            echo "::error::Only unsigned test releases are allowed outside cwuom/NeriPlayer."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Checkout trusted release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/actions/android-ndk

      - name: Exclude CI tooling from the target source fingerprint
        run: printf '\n/.release-tooling/\n' >> "$(git rev-parse --git-path info/exclude)"

      - name: Prepare shared build identity
        id: identity
        run: python3 -B .release-tooling/.github/scripts/release_artifacts.py prepare --github-output "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: meta
        env:
          BUILD_VERSION_TIMESTAMP: ${{ steps.identity.outputs.build_version_timestamp }}
          TEST_RELEASE: ${{ inputs.test_release }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          target_sha="$(git rev-parse HEAD)"
          tag_name="NeriPlayer-${short_sha}.${BUILD_VERSION_TIMESTAMP}"
          if [[ "$TEST_RELEASE" == "true" ]]; then
            tag_name="${tag_name}-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          previous_tag="$(git for-each-ref --merged HEAD --sort=-creatordate --format='%(refname:short)' 'refs/tags/NeriPlayer-*' | head -n 1 || true)"
          {
            echo "tag_name=${tag_name}"
            echo "target_sha=${target_sha}"
            echo "previous_tag=${previous_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Share build identity with Gradle
        env:
          BUILD_UUID: ${{ steps.identity.outputs.build_uuid }}
          BUILD_TIMESTAMP: ${{ steps.identity.outputs.build_timestamp }}
          BUILD_VERSION_TIMESTAMP: ${{ steps.identity.outputs.build_version_timestamp }}
        run: |
          {
            echo "ORG_GRADLE_PROJECT_buildUuid=${BUILD_UUID}"
            echo "ORG_GRADLE_PROJECT_buildTimestamp=${BUILD_TIMESTAMP}"
            echo "ORG_GRADLE_PROJECT_buildVersionTimestamp=${BUILD_VERSION_TIMESTAMP}"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Decode keystore
        if: ${{ !inputs.test_release }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          mkdir -p app
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/neri.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.release-tooling/.github/actions/android-ndk

      - name: Verify the checked out release sources
        run: |
          ./gradlew testDebugUnitTest lintDebug \
            --warning-mode all --stacktrace
          if [[ -f tools_pub/quality/module_boundaries.py ]]; then
            python3 -B tools_pub/quality/module_boundaries.py
          fi

      - name: Verify Native USB behavior
        run: |
          native_manifest=""
          for candidate in \
            modules/native/src/main/cpp/tests/usb/config/run-manifest.example.yaml \
            app/src/main/cpp/tests/usb/config/run-manifest.example.yaml; do
            if [[ -f "${candidate}" ]]; then
              native_manifest="${candidate}"
              break
            fi
          done
          if [[ -n "${native_manifest}" ]]; then
            tools_pub/usb-async-lab host-test \
              --manifest "${native_manifest}" \
              --profile release-werror-asserts
          elif [[ -f tools_pub/usb-async-lab ]]; then
            echo "Native USB host test manifest is missing from this target ref." >&2
            exit 1
          else
            echo "::notice::This target ref predates the Native USB host tests."
          fi

      - name: Build signed Release APKs
        if: ${{ !inputs.test_release }}
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: neri.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: key0
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PbuildAllReleaseAbis=true \
            --warning-mode all --stacktrace

      - name: Build unsigned test Release APKs
        if: ${{ inputs.test_release }}
        run: |
          ./gradlew :app:assembleRelease \
            -PbuildAllReleaseAbis=true -PallowUnsignedRelease=true \
            --warning-mode all --stacktrace

      - name: Remove temporary signing keystore
        if: ${{ always() && !inputs.test_release }}
        run: rm -f app/neri.jks

      - name: Stage and verify release artifacts
        env:
          NERI_BUILD_UUID: ${{ steps.identity.outputs.build_uuid }}
          NERI_BUILD_TIMESTAMP: ${{ steps.identity.outputs.build_timestamp }}
          NERI_BUILD_VERSION_TIMESTAMP: ${{ steps.identity.outputs.build_version_timestamp }}
          NERI_SIGNING_MODE: ${{ inputs.test_release && 'unsigned' || 'signed' }}
        run: |
          python3 -B .release-tooling/.github/scripts/release_artifacts.py stage \
            --apk-dir app/build/outputs/apk/release --output-dir release-assets \
            --expected-abis arm64-v8a,armeabi-v7a,x86,x86_64

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-verification-${{ steps.meta.outputs.target_sha }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.*
            .report/usb/execution/**/host-release-werror-asserts/**/ctest.xml
            .report/usb/execution/**/host-release-werror-asserts/**/host-test.log
            .report/usb/execution/**/host-release-werror-asserts/**/source-context.txt
          include-hidden-files: true
          if-no-files-found: warn

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
        run: |
          set -euo pipefail

          api_args=(
            --method POST
            "repos/${REPO}/releases/generate-notes"
            -f "tag_name=${TAG_NAME}"
            -f "target_commitish=${TARGET_SHA}"
          )

          if [ -n "${PREVIOUS_TAG}" ]; then
            api_args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi

          gh api "${api_args[@]}" --jq '.body' > release-notes.md

          {
            echo
            echo
            echo "## Commits"
            if [ -n "${PREVIOUS_TAG}" ]; then
              git log --first-parent --pretty='- %h %s' "${PREVIOUS_TAG}..HEAD"
            else
              git log --first-parent --pretty='- %h %s'
            fi
          } >> release-notes.md

          python3 -B .release-tooling/.github/scripts/release_artifacts.py notes \
            --notes-file release-notes.md --metadata-file release-assets/build-metadata.json
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.meta.outputs.tag_name }}
          path: |
            release-assets/*
            release-notes.md
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          TEST_RELEASE: ${{ inputs.test_release }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_files=(release-assets/*)
          if [ "${#release_files[@]}" -lt 7 ]; then
            echo "The verified APKs and release metadata are incomplete."
            exit 1
          fi

          release_options=(--latest)
          if [[ "$TEST_RELEASE" == "true" ]]; then
            release_options=(--draft --prerelease --latest=false)
          fi
          gh release create "${TAG_NAME}" "${release_files[@]}" \
            --repo "${REPO}" \
            --target "${TARGET_SHA}" \
            --title "${TAG_NAME}" \
            --notes-file release-notes.md \
            "${release_options[@]}"
