name: Build APK (daily-recommend)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK (installable) and unsigned Release
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -PallowUnsignedRelease=true --warning-mode all --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: neri-apk-daily-recommend
          path: |
            app/build/outputs/apk/debug/**/*.apk
            app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
