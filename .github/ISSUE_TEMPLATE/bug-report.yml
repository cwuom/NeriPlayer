name: Bug report / 报告问题
description: 提交一份问题报告帮助开发者改进产品 / Submit a bug report to help improve the product
title: "[BUG] "
labels: [ "Bug" ]


body:
  - type: markdown
    attributes:
      value: |
        感谢给 NeriPlayer 汇报问题！
        为了使我们更好地帮助你，请提供以下信息。
        
        Thank you for reporting an issue with NeriPlayer!
        To help us assist you better, please provide the following information.

  - type: textarea
    attributes:
      label: 问题描述 / Problem description
      placeholder: 简要描述你遇到的问题 / Briefly describe the issue you're experiencing
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开应用的某个页面
        2. 点击特定按钮
        3. 观察到错误发生
        
        1. Open a specific page in the app
        2. Click a particular button
        3. Observe the error occurring
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期行为 / Expected behaviour
      placeholder: 正常情况下应该发生什么 / Tell us what should happen
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实际行为 / Actual behaviour
      description: 如果含有截图，个人信息注意打码保护 / If including screenshots, please censor personal information
      placeholder: 实际上发生了什么 / Tell us what happens instead
    validations:
      required: true

  - type: input
    attributes:
      label: 你使用的安卓系统版本 / Your Android version
    validations:
      required: true

  - type: input
    attributes:
      label: 你正在使用的手机型号 / Your phone model
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 播放环境 / Playback environment
        以下信息有助于区分平台、音频输出与 USB 独占链路的问题。

        The following information helps distinguish source, audio-output, and USB-exclusive issues.

  - type: dropdown
    id: playback-platform
    attributes:
      label: 问题涉及的播放平台 / Affected playback platform
      description: 可多选；非播放类问题请选择“不涉及播放” / Multiple selections allowed; choose “Not related to playback” for non-playback issues
      multiple: true
      options:
        - 网易云音乐 / NetEase Cloud Music
        - Bilibili
        - YouTube Music
        - 本地音频或下载文件 / Local audio or downloaded files
        - 自动换源或多个平台 / Automatic source switching or multiple platforms
        - 不涉及播放 / Not related to playback
    validations:
      required: true

  - type: dropdown
    id: audio-output
    attributes:
      label: 复现时的音频输出设备 / Audio output during reproduction
      description: 请选择复现问题时实际使用的输出设备 / Select the device that was in use when the issue occurred
      options:
        - 手机或平板扬声器 / Device speaker
        - 有线耳机或 USB-C 耳机 / Wired or USB-C headphones
        - 蓝牙耳机或音箱 / Bluetooth device
        - USB DAC 或 USB 音频接口 / USB DAC or USB audio interface
        - 其他输出设备 / Other output device
        - 不涉及播放 / Not related to playback
    validations:
      required: true

  - type: dropdown
    id: usb-exclusive
    attributes:
      label: 是否开启 USB 独占播放 / Is USB exclusive playback enabled
      description: 请按复现问题时的设置选择；这与是否连接 USB DAC 是两个信息 / Choose the setting used during reproduction; this is separate from whether a USB DAC was connected
      options:
        - 已开启，且正在使用 USB DAC / Enabled, using a USB DAC
        - 已开启，但本次未使用 USB DAC / Enabled, without a USB DAC in this case
        - 未开启 / Disabled
        - 不确定 / Not sure
        - 不涉及播放 / Not related to playback
    validations:
      required: true

  - type: textarea
    id: usb-audio-details
    attributes:
      label: USB 音频设备与播放设置（如适用） / USB audio device and playback settings (if applicable)
      description: 如使用 USB DAC 或开启 USB 独占，请填写 DAC/转接器型号、直连或 Hub、采样率/位深、比特完美音量等；请勿提供序列号或其他敏感信息 / For USB DAC or USB-exclusive issues, include the DAC/adapter model, direct or hub connection, sample rate/bit depth, bit-perfect volume, and related settings. Do not include serial numbers or other sensitive data.
      placeholder: |
        DAC/转接器型号：
        连接方式：直连 / Hub
        采样率与位深：
        相关播放设置：
    validations:
      required: false

  - type: textarea
    id: playback-context
    attributes:
      label: 播放内容与相关设置（如适用） / Playback item and related settings (if applicable)
      description: 可填写歌曲/视频链接或名称、在线播放或本地/下载文件、音质、自动换源等。链接、账号和个人信息请先脱敏 / Include a song/video link or name, streaming or local/downloaded state, quality, automatic source switching, and related settings. Redact links, account data, and personal information as needed.
    validations:
      required: false

  - type: checkboxes
    id: latest
    attributes:
      label: 版本和其他要求 / Version and Other Requirements
      options:
        - label: 我使用的是最新 CI 版本，并已开启开发者模式（在设置中连续点击 7 次版本号）。/ I'm using the latest CI build with DEBUG Mode enabled (by tapping the version number 7 times in Settings).
          required: false
        - label: 我已经在 [Issue Tracker](https://github.com/cwuom/NeriPlayer/issues) 中找过我要提出的问题，没有找到相同问题。重复问题会被关闭。 / I have searched in the [Issue Tracker](https://github.com/cwuom/NeriPlayer/issues) and found no similar issues. Duplicate issues will be closed.
          required: true
        - label: 我已知晓并同意，如果我不按照模板提供的指示进行填写，则我的 Issue 可能会被无条件删除。 / I understand and agree that my issue may be deleted without notice if I do not follow the instructions provided in the template.
          required: true

  - type: textarea
    attributes:
      label: 日志 / Logs
      description: 请先开启开发者模式（在设置界面点击 7 次版本号）复现问题，然后在调试页面查看并导出日志。 / Please enable DEBUG Mode first (tap the version number 7 times in Settings), reproduce the issue, then view and export logs from the Debug page.
      placeholder: 将日志粘贴到此处或者点击文本框底栏上传日志文件。 / Paste logs here or upload logs by clicking the bar on the bottom.
    validations:
      required: false

  - type: textarea
    id: extra-desc
    attributes:
      label: 补充说明（可选） / Additional information (optional)
      description: 任何其他与问题相关的信息都可以在这里提供 / Any other relevant information about the issue can be provided here
    validations:
      required: false
