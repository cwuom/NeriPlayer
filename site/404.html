<style>
  /* GitHub Pages 会在任意缺失路径下返回本页，所以样式与图形全部内联，不依赖相对路径 */
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #fbf7ef; color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #1f1b16;
    -webkit-font-smoothing: antialiased;
    background:
      linear-gradient(rgba(31, 27, 22, .045) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(31, 27, 22, .045) 1px, transparent 1px) 0 0 / 24px 24px,
      #fbf7ef;
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  main { width: min(600px, 100%); }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; }
  .hand { font-family: "Segoe Print", "Bradley Hand", "Kaiti SC", "STKaiti", "KaiTi", "LXGW WenKai", cursive; }
  .mono { font-family: "JetBrains Mono", "SF Mono", "Cascadia Mono", Consolas, monospace; }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font-size: 11px; font-weight: 600; letter-spacing: .2em; color: #8a8175; text-transform: uppercase; }
  .eyebrow b { color: #e0584a; }
  .eyebrow i { width: 42px; height: 1px; background: #d9d0c1; }
  h1 { margin: 0; font-size: clamp(34px, 7vw, 52px); font-weight: 500; line-height: 1.15; letter-spacing: -.01em; }
  h1 em { font-style: normal; background: linear-gradient(transparent 64%, rgba(224, 88, 74, .28) 0); }
  .lead { margin: 16px 0 0; max-width: 32em; font-size: 16px; line-height: 1.85; color: #4a4339; }
  code { padding: .1em .45em; border: 1px solid #e6dccb; border-radius: 5px; background: #fffdf7; font-size: .86em; overflow-wrap: anywhere; }
  .ticket {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 120px;
    margin-top: 34px;
    border-radius: 10px;
    color: #1d1842;
    background:
      repeating-linear-gradient(115deg, rgba(138, 106, 214, .06) 0 1px, transparent 1px 8px),
      linear-gradient(120deg, #f2ecfd 0%, #eef5fd 52%, #fdf0f4 100%);
    filter: drop-shadow(0 22px 26px rgba(60, 44, 20, .22)) drop-shadow(0 3px 5px rgba(60, 44, 20, .1));
    transform: rotate(-1.2deg);
  }
  .ticket__main { padding: 22px 26px 20px; }
  .ticket__line { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1.5px solid rgba(29, 24, 66, .14); font-size: 13px; font-weight: 700; }
  .ticket__line img { width: 28px; height: 28px; border-radius: 7px; }
  .route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-top: 16px; }
  .stop small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .3em; color: #6c4fc0; }
  .stop b { display: block; font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: .04em; }
  .stop--to { text-align: right; }
  .stop--to b { color: #e0584a; }
  .dash { height: 2px; background: repeating-linear-gradient(90deg, #1d1842 0 8px, transparent 8px 13px); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 16px; font-size: 11.5px; color: rgba(29, 24, 66, .6); }
  .ticket__stub { display: grid; place-items: center; border-left: 2px dashed rgba(29, 24, 66, .22); }
  .stamp { display: grid; place-items: center; width: 64px; height: 64px; border: 2px solid #e0584a; border-radius: 50%; color: #e0584a; font-size: 22px; font-weight: 700; transform: rotate(-14deg); opacity: .9; }
  .note { margin: 26px 0 0 8px; font-size: 21px; color: #6b6255; transform: rotate(-1.5deg); }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px; border: 1.5px solid #1f1b16; border-radius: 999px; color: #1f1b16; font-size: 14.5px; font-weight: 600; text-decoration: none; transition: transform .35s cubic-bezier(.16, 1, .3, 1), box-shadow .35s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 3px 4px 0 rgba(31, 27, 22, .18); }
  .btn--ink { background: #1f1b16; color: #fbf7ef; }
  @media (max-width: 520px) {
    .ticket { grid-template-columns: 1fr; transform: none; }
    .ticket__stub { padding: 14px; border-left: 0; border-top: 2px dashed rgba(29, 24, 66, .22); }
    .stop b { font-size: 24px; }
  }
</style>
</head>
